[project]
name = "radar-track-lab"
version = "0.1.0"
description = "Radar multi-target tracking (EKF + GNN) evaluated against ADS-B ground truth"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.9", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
